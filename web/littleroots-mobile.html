<style>
/* LittleRoots for phones and tablets: touch-first, portrait browsing, full-screen landscape player. */
:root {
  --forest: #0D322C; --deep: #08231F; --canopy: #13443B; --moss: #1E5A4D;
  --gold: #D09D46; --gold-soft: #E7C27F; --parchment: #F3EBD8; --mist: #A9C2B8; --danger: #E08A6D;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --tabbar: 62px; --pad: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--forest); color: var(--parchment); }
body { font-family: var(--body); line-height: 1.4; overflow-x: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body.lock-scroll { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
input { font: inherit; }
h1, h2, h3 { font-family: var(--display); font-variation-settings: "SOFT" 100; margin: 0; }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; }
.press { transition: transform .15s ease, opacity .15s; }
.press:active { transform: scale(.96); opacity: .85; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* top bar */
.top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--st) + 8px) calc(var(--pad) + var(--sr)) 8px calc(var(--pad) + var(--sl));
  background: linear-gradient(rgba(13,50,44,.96), rgba(13,50,44,.75) 60%, rgba(13,50,44,0)); transition: background .25s, box-shadow .25s; }
.top.solid { background: rgba(13,50,44,.98); box-shadow: 0 6px 20px rgba(0,0,0,.28); }
.top .logo { width: 78px; height: auto; display: block; }
.logo .st0, .logo-anim .st0 { fill: var(--parchment); } .logo .st1, .logo-anim .st1 { fill: var(--gold); }
.top-title { min-height: 56px; font-family: var(--display); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.top-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(243,235,216,.1); flex: none; }
body.on-moments .top { display: none; }

.tab { min-height: 100vh; padding: calc(var(--st) + 82px) 0 calc(var(--tabbar) + var(--sb) + 28px); }

/* category chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px calc(var(--pad) + var(--sr)) 14px calc(var(--pad) + var(--sl)); scrollbar-width: none; }
.chips::-webkit-scrollbar, .track::-webkit-scrollbar, .worlds::-webkit-scrollbar, .feed::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 15px; border-radius: 99px; border: 1.5px solid rgba(243,235,216,.28); font-weight: 800; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--parchment); color: var(--forest); border-color: var(--parchment); }

/* featured card */
.feature { position: relative; margin: 4px calc(var(--pad) + var(--sr)) 26px calc(var(--pad) + var(--sl)); border-radius: 22px; overflow: hidden; background: var(--canopy);
  box-shadow: 0 18px 44px rgba(0,0,0,.38); max-width: 760px; }
.feature .bg { position: absolute; inset: -30%; background-size: cover; background-position: center; filter: blur(30px) saturate(1.3); opacity: .5; }
.feature .art { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
.feature .art img, .feature .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.feature .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(19,68,59,.9), rgba(19,68,59,0) 45%); }
.feature .body { position: relative; display: grid; gap: 8px; padding: 0 18px 18px; margin-top: -34px; }
.eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); }
.feature h1 { font-size: 27px; line-height: 1.04; font-weight: 900; text-wrap: balance; }
.feature p { margin: 0; color: var(--mist); font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; font-weight: 700; color: var(--mist); }
.meta .ref { color: var(--gold-soft); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 800; font-size: 16px; background: rgba(243,235,216,.14); }
.btn.primary { background: var(--gold); color: var(--forest); }
.btn svg { width: 22px; height: 22px; fill: currentColor; }

/* worlds */
.sec-title { font-size: 20px; font-weight: 700; padding: 0 calc(var(--pad) + var(--sr)) 10px calc(var(--pad) + var(--sl)); }
.worlds { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: calc(var(--pad) + var(--sl)); padding: 0 calc(var(--pad) + var(--sr)) 26px calc(var(--pad) + var(--sl)); scrollbar-width: none; }
.world { position: relative; flex: none; width: min(38vw, 190px); aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; background: var(--canopy); scroll-snap-align: start; border: 1px solid rgba(243,235,216,.12); }
.world img, .world canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.world span { position: absolute; inset: auto 0 0 0; padding: 40px 12px 12px; font-family: var(--display); font-weight: 900; font-size: 17px; line-height: 1.05; background: linear-gradient(0deg, rgba(8,35,31,.95), rgba(8,35,31,0)); }

/* rows */
.row { margin-bottom: 24px; }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 calc(var(--pad) + var(--sr)) 10px calc(var(--pad) + var(--sl)); }
.row-head h2 { font-size: 19px; font-weight: 700; }
.row-head small { display: block; color: var(--mist); font-size: 12.5px; font-weight: 700; font-family: var(--body); }
.more { color: var(--gold-soft); font-weight: 800; font-size: 14px; min-height: 36px; display: flex; align-items: center; gap: 2px; flex: none; }
.more svg { width: 18px; height: 18px; fill: currentColor; }
.track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: calc(var(--pad) + var(--sl)); padding: 0 calc(var(--pad) + var(--sr)) 4px calc(var(--pad) + var(--sl)); scrollbar-width: none; }
.card { flex: none; width: min(44vw, 250px); scroll-snap-align: start; display: grid; gap: 6px; align-content: start; }
.card.short { width: min(31vw, 170px); }
.thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--canopy); }
.card.short .thumb { aspect-ratio: 9 / 16; }
.thumb img, .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card b { font-size: 13.5px; line-height: 1.25; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card em { font-style: normal; font-size: 12px; color: var(--mist); margin-top: -3px; }
.badge { position: absolute; top: 7px; left: 7px; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 800; background: rgba(13,50,44,.88); color: var(--gold-soft); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(13,50,44,.7); }
.bar i { display: block; height: 100%; background: var(--gold); }
.playdot { position: absolute; right: 8px; bottom: 9px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(8,35,31,.75); }
.playdot svg { width: 16px; height: 16px; fill: var(--parchment); }

/* grids (category page, search) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 10px; padding: 0 calc(var(--pad) + var(--sr)) 0 calc(var(--pad) + var(--sl)); }
.grid.shorts { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.grid .card { width: auto; }
.page-note { color: var(--mist); font-size: 14px; padding: 0 calc(var(--pad) + var(--sr)) 16px calc(var(--pad) + var(--sl)); margin: 0; }

/* search */
.search { display: block; position: relative; margin: 0 calc(var(--pad) + var(--sr)) 18px calc(var(--pad) + var(--sl)); }
.search input { display: block; -webkit-appearance: none; appearance: none; width: 100%; height: 50px; border-radius: 14px; border: 0; padding: 0 44px 0 46px; background: var(--canopy); color: var(--parchment); font-size: 16px; font-weight: 700; }
.search input::placeholder { color: var(--mist); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.search > svg { position: absolute; left: 14px; top: 13px; fill: var(--mist); }
.search .clear { position: absolute; right: 4px; top: 3px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--mist); }
.empty { text-align: center; color: var(--mist); padding: 30px 24px; display: grid; gap: 8px; justify-items: center; }
.empty h3 { color: var(--parchment); font-size: 20px; }

/* tab bar */
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar) + var(--sb)); padding: 0 var(--sr) var(--sb) var(--sl);
  background: rgba(8,35,31,.96); border-top: 1px solid rgba(243,235,216,.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
body.on-moments .tabbar { background: rgba(0,0,0,.78); border-top-color: rgba(255,255,255,.06); }
.tabbar button { display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--mist); }
.tabbar button[aria-current="true"] { color: var(--gold); }
.tabbar svg { width: 25px; height: 25px; fill: currentColor; }

/* detail sheet */
.sheet-layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(4,18,16,.62); opacity: 0; transition: opacity .25s; }
.sheet-layer.open { opacity: 1; }
.sheet { position: relative; width: min(680px, 100%); max-height: calc(100% - var(--st) - 20px); overflow-y: auto; overscroll-behavior: contain; background: var(--canopy);
  border-radius: 22px 22px 0 0; transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.85,.25,1); padding-bottom: calc(var(--sb) + 22px); }
.sheet-layer.open .sheet { transform: none; }
.sheet.dragging { transition: none; }
.grab { position: absolute; z-index: 2; top: 8px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px; background: rgba(243,235,216,.55); }
.sheet .close { position: absolute; z-index: 2; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(8,35,31,.7); }
.sheet .art { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
.sheet .art img, .sheet .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet .art .big-play { position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; display: grid; place-items: center; background: rgba(8,35,31,.72); border: 2px solid rgba(243,235,216,.5); }
.sheet .art .big-play svg { width: 32px; height: 32px; fill: var(--parchment); margin-left: 4px; }
.sheet-body { display: grid; gap: 12px; padding: 16px 18px 0; }
.sheet h2 { font-size: 26px; font-weight: 900; line-height: 1.05; }
.sheet p { margin: 0; color: var(--parchment); opacity: .9; font-size: 15px; }
.stack { display: grid; gap: 10px; }
.talk { display: grid; gap: 6px; padding: 14px 16px; border-radius: 14px; background: var(--forest); }
.talk h3 { font-size: 16px; font-weight: 700; color: var(--gold-soft); display: flex; align-items: center; gap: 8px; }
.talk ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.sheet .grid { padding: 0; }

/* gate / grown-ups */
.layer { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: calc(var(--st) + 16px) 16px calc(var(--sb) + 16px); background: rgba(4,18,16,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; }
.gate { width: min(420px, 100%); padding: 24px 20px; border-radius: 22px; background: var(--canopy); display: grid; gap: 14px; text-align: center; }
.gate h2 { font-size: 23px; }
.gate .q { font-family: var(--display); font-size: 40px; font-weight: 900; color: var(--gold-soft); }
.choices { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.choices .btn { min-width: 78px; font-size: 20px; }
.msg { min-height: 1.4em; color: var(--danger); font-weight: 700; }
.set { display: grid; gap: 8px; text-align: left; }
.set h3 { font-size: 16px; font-weight: 700; }
.set .chips { padding: 0; flex-wrap: wrap; }
.set .chip[aria-pressed="true"] { background: var(--gold); color: var(--forest); border-color: var(--gold); }
.hint { font-size: 13px; color: var(--mist); }

/* splash + animated logo (same as the TV app) */
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; justify-items: center; gap: 26px; text-align: center; background: var(--forest); transition: opacity .6s ease, visibility .6s; }
.splash.done { opacity: 0; visibility: hidden; }
.splash .sting { width: min(17rem, 64vw); font-size: min(1.2rem, 4.4vw); }
.splash .tagline { margin: 0; padding-inline: 1.5rem; font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 500; font-style: italic; font-size: clamp(1.05rem, 4.6vw, 1.6rem); line-height: 1.3; text-wrap: balance; }
.splash .tagline span { display: inline-block; opacity: 0; animation: tag-in .7s cubic-bezier(.2,.8,.3,1) both; }
.splash .tagline span:nth-child(1) { animation-delay: 3.5s; } .splash .tagline span:nth-child(2) { animation-delay: 4s; color: var(--gold-soft); }
@keyframes tag-in { from { opacity: 0; transform: translateY(.6em); } to { opacity: 1; transform: none; } }
.logo-anim { display: block; overflow: visible; width: 100%; height: auto; }
.logo-anim path { transform-box: fill-box; transform-origin: 50% 100%; animation: lr-pop .55s cubic-bezier(.3,1.6,.5,1) both, lr-wave 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms), calc(1.1s + var(--i) * 85ms); }
.logo-anim .st1 { transform-origin: 50% 80%; animation: lr-grow .9s cubic-bezier(.3,1.5,.5,1) both, lr-sway 2.4s ease-in-out infinite; animation-delay: .1s, 1.1s; }
@keyframes lr-pop { from { opacity: 0; transform: translateY(35%) scale(.5); } to { opacity: 1; transform: none; } }
@keyframes lr-wave { 0%, 55%, 100% { transform: none; } 25% { transform: translateY(-9%); } }
@keyframes lr-grow { 0% { opacity: 0; transform: scale(.2, 0); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes lr-sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg) scale(1.04); } }
.sting { position: relative; display: block; }
.sting .logo-anim { position: relative; z-index: 1; animation: lr-hop .8s ease-out 3.08s both, lr-glow 1.6s ease-in-out 3.15s both; }
.sting .logo-anim path { opacity: 0; animation-name: lr-spring, lr-wave; animation-duration: .8s, 2.4s; animation-timing-function: cubic-bezier(.25,1.3,.4,1), ease-in-out; animation-iteration-count: 1, infinite; animation-fill-mode: both, none; animation-delay: calc(1.35s + var(--i) * 135ms), calc(4.65s + var(--i) * 85ms); }
.sting .logo-anim .rt { animation-name: lr-drop, lr-wave; animation-duration: .85s, 2.4s; }
.sting .logo-anim .st1 { transform-origin: 50% 80%; animation: lr-sprout 1.05s cubic-bezier(.3,1.4,.5,1) .83s both, lr-sway 2.4s ease-in-out 4.65s infinite; }
@keyframes lr-spring { 0% { opacity: 0; transform: translateY(70%) scale(.4,.2); } 35% { opacity: 1; transform: translateY(-24%) scale(.85,1.25); } 60% { transform: translateY(6%) scale(1.15,.85); } 80% { transform: translateY(-4%) scale(.97,1.04); } 100% { opacity: 1; transform: none; } }
@keyframes lr-drop { 0% { opacity: 0; transform: translateY(-170%) scale(.9,1.2); } 45% { opacity: 1; transform: translateY(0) scale(1.25,.7); } 65% { transform: translateY(-20%) scale(.92,1.1); } 82% { transform: translateY(0) scale(1.06,.94); } 100% { opacity: 1; transform: none; } }
@keyframes lr-sprout { 0% { opacity: 0; transform: scale(.1,0) rotate(-20deg); } 30% { opacity: 1; transform: scale(.5,.7) rotate(-6deg); } 55% { transform: scale(1.1,1.2) rotate(9deg); } 78% { transform: scale(.95) rotate(-4deg); } 100% { opacity: 1; transform: none; } }
@keyframes lr-hop { 0%, 100% { transform: none; } 40% { transform: translateY(-6%) scale(1.06); } 70% { transform: translateY(1%) scale(.99); } }
@keyframes lr-glow { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 .7em rgba(231,194,127,.8)); } }
.sting .seed { position: absolute; z-index: 2; left: 35.5%; top: 47%; width: .9em; height: .9em; margin: -.45em 0 0 -.45em; border-radius: 50% 50% 46% 46%; background: radial-gradient(circle at 35% 30%, #F6D9A0, var(--gold) 60%); animation: seed-fall .75s cubic-bezier(.45,0,1,.5) both, seed-land .35s ease-out .75s both; }
@keyframes seed-fall { 0% { transform: translateY(-16em) rotate(-200deg); } 100% { transform: none; } }
@keyframes seed-land { 0% { transform: scale(1.6,.55); } 55% { opacity: 1; transform: scale(.85,1.15); } 100% { opacity: 0; transform: scale(0); } }
.sting .burst { position: absolute; z-index: 2; left: 35.5%; top: 47%; }
.sting .burst i { position: absolute; left: 0; top: 0; width: .42em; height: .42em; margin: -.21em; border-radius: 50%; background: var(--gold-soft); opacity: 0; animation: lr-spark 1s cubic-bezier(.15,.85,.3,1) .83s both; }
.sting .burst i:nth-child(3n) { background: var(--parchment); width: .3em; height: .3em; }
.sting .burst i:nth-child(2n) { animation-delay: .89s; }
@keyframes lr-spark { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(1.2); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(.2); } }
.sting .tw { position: absolute; z-index: 2; width: .55em; height: .55em; background: var(--gold-soft); transform: rotate(45deg) scale(0); border-radius: 2px; box-shadow: 0 0 .5em rgba(231,194,127,.9); animation: lr-twinkle 1.8s ease-in-out infinite; }
@keyframes lr-twinkle { 0%, 100% { transform: rotate(45deg) scale(0); opacity: 0; } 50% { transform: rotate(45deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sting .seed, .sting .burst, .sting .tw { display: none; } .logo-anim path, .logo-anim .st1, .sting .logo-anim, .sting .logo-anim path, .sting .logo-anim .st1 { animation: lr-fade .5s both; } .splash .tagline span { animation: lr-fade .6s both; } @keyframes lr-fade { from { opacity: 0; } } }

/* player */
.player { position: fixed; inset: 0; z-index: 60; background: #000; color: var(--parchment); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
.p-media { position: absolute; inset: 0; }
.p-media iframe, .p-media video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; background: #000; pointer-events: none; }
.p-tap { position: absolute; inset: 0; z-index: 1; }
.p-ctl { position: absolute; inset: 0; z-index: 2; background: rgba(0,0,0,.45); transition: opacity .28s; pointer-events: none; }
.p-ctl .hit { pointer-events: auto; }
.player.idle .p-ctl, .player.locked .p-ctl { opacity: 0; }
.player.idle .p-ctl .hit, .player.locked .p-ctl .hit { pointer-events: none; }
.p-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: max(12px, var(--st)) max(14px, var(--sr)) 0 max(14px, var(--sl)); }
.p-top .ttl { flex: 1; min-width: 0; }
.p-top h2 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-top small { display: block; color: var(--mist); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.round { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.round svg { width: 30px; height: 30px; fill: currentColor; }
.round.big { width: 78px; height: 78px; background: rgba(243,235,216,.16); }
.round.big svg { width: 40px; height: 40px; }
.p-mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: clamp(26px, 10vw, 84px); }
.p-mid .skip { position: relative; }
.p-mid .skip b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; padding-top: 2px; }
.p-bot { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 2px; padding: 0 max(16px, var(--sr)) max(10px, var(--sb)) max(16px, var(--sl)); }
.scrub { position: relative; height: 34px; display: flex; align-items: center; touch-action: none; }

  const tg = el.querySelector('[data-a="toggle"].play-toggle'); if (tg) { tg.innerHTML = me.paused ? ICON.play : ICON.pause; tg.setAttribute("aria-label", me.paused ? "Play" : "Pause"); }
}
function drawTime() {
  const el = $("#player"), me = P; if (!me || el.hidden) return;
  const pct = me.total ? Math.min(100, me.t / me.total * 100) : 0;
  const f = el.querySelector(".scrub .fill"), k = el.querySelector(".scrub .knob"); if (!f) return;
  f.style.width = pct + "%"; k.style.left = pct + "%";
  el.querySelector(".p-times .cur").textContent = fmt(me.t);
  el.querySelector(".p-times .tot").textContent = me.total ? "-" + fmt(me.total - me.t) : "–:––";
}
function wake() {
  const el = $("#player"), me = P; if (!me) return;
  el.classList.remove("idle"); clearTimeout(me.idle);
  me.idle = setTimeout(() => { if (P === me && !me.paused && !me.dragging) el.classList.add("idle"); }, 3500);
}
function wirePlayer(el, me) {
  el.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); action(b.dataset.a); }));
  // tap: show/hide controls. Double-tap left or right side: skip 10 seconds.
  const tap = el.querySelector(".p-tap"); let last = 0, single = null;
  tap.addEventListener("click", e => {
    if (P !== me) return;
    if (me.locked) { el.classList.remove("idle"); return wake(); }
    const now = Date.now(), side = e.clientX < innerWidth * 0.4 ? "l" : e.clientX > innerWidth * 0.6 ? "r" : null;
    if (side && now - last < 300) { clearTimeout(single); last = 0; skip(side === "r" ? 10 : -10, side); return; }
    last = now;
    clearTimeout(single);
    single = setTimeout(() => { if (P !== me) return; if (el.classList.contains("idle")) wake(); else { el.classList.add("idle"); clearTimeout(me.idle); } }, side ? 260 : 0);
  });
  // scrubber
  const sc = el.querySelector(".scrub"), tip = sc.querySelector(".tip");
  const at = x => { const r = sc.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)); };
  const show = f => { const pct = f * 100; sc.querySelector(".fill").style.width = pct + "%"; sc.querySelector(".knob").style.left = pct + "%"; tip.style.left = pct + "%"; tip.textContent = fmt(f * (me.total || 0)); };
  sc.addEventListener("pointerdown", e => { if (!me.total) return; me.dragging = true; sc.classList.add("drag"); try { sc.setPointerCapture(e.pointerId); } catch (x) {} show(at(e.clientX)); wake(); });
  sc.addEventListener("pointermove", e => { if (me.dragging) show(at(e.clientX)); });
  const end = e => { if (!me.dragging) return; me.dragging = false; sc.classList.remove("drag"); const f = at(e.clientX); me.t = f * me.total; me.eng.seek(me.t); drawTime(); wake(); };
  sc.addEventListener("pointerup", end); sc.addEventListener("pointercancel", end);
}
function skip(by, side) {
  const me = P; if (!me || !me.eng) return;
  me.t = Math.max(0, Math.min((me.total || 1e9) - 1, me.t + by)); me.eng.seek(me.t); drawTime();
  const r = $("#player").querySelector(".ripple." + (side || (by > 0 ? "r" : "l"))); if (r) { r.classList.remove("show"); void r.offsetWidth; r.classList.add("show"); }
}
function action(a) {
  const me = P; if (!me) return;
  if (a === "close") return closePlayer();
  if (a === "lock") { me.locked = true; $("#player").classList.add("locked"); $("#player").classList.remove("idle"); return wake(); }
  if (a === "unlock") { me.locked = false; $("#player").classList.remove("locked"); return wake(); }
  if (a === "toggle") { if (!me.started || me.paused) me.eng.play(); else me.eng.pause(); return wake(); }
  if (a === "back") return skip(-10, "l"), wake();
  if (a === "fwd") return skip(10, "r"), wake();
  if (a === "next") return play(nextOf(bySlug(me.slug)).slug, { fromStart: true });
}
function showEnd() {
  const me = P, el = $("#player"), v = bySlug(me.slug), n = nextOf(v);
  me.finished = true; let left = 8;
  const end = document.createElement("div"); end.className = "p-end";
  end.innerHTML = `<span class="eyebrow">Well done! Story finished</span>
    <div class="next">${thumbOf(n) ? `<img src="${esc(thumbOf(n))}" alt="">` : ""}
      <div style="display:grid;gap:8px"><span class="hint">Up next</span><h3>${esc(n.title)}</h3><span class="count">Starting in <b>${left}</b> s</span>
      <div class="acts"><button class="btn primary press" data-e="next">${ICON.play}Play now</button><button class="btn press" data-e="again">Watch again</button><button class="btn press" data-e="close">Back to LittleRoots</button></div></div></div>
    ${v.talk.length ? `<div class="talk"><h3>Talk about it together</h3><ol>${v.talk.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>` : ""}`;
  el.appendChild(end);
  const go = what => { clearInterval(me.end); if (P !== me) return; if (what === "close") return closePlayer(); play(what === "again" ? v.slug : n.slug, { fromStart: true }); };
  end.querySelectorAll("[data-e]").forEach(b => b.onclick = e => { e.stopPropagation(); go(b.dataset.e); });
  me.end = setInterval(() => { left--; const c = end.querySelector(".count b"); if (c) c.textContent = left; if (left <= 0) go("next"); }, 1000);
  end.addEventListener("touchstart", () => { clearInterval(me.end); const c = end.querySelector(".count"); if (c) c.textContent = "Paused"; }, { passive: true });
}
function stopPlayback(finished) {
  const me = P; if (!me) return;
  clearInterval(me.tick); clearInterval(me.watch); clearInterval(me.end); clearTimeout(me.idle);
  try { me.t = me.eng.time() || me.t; } catch (e) {}
  try { me.eng.destroy(); } catch (e) {}
  if (me.total) { durs[me.slug] = Math.round(me.total); store.set("dur", durs); }
  delete progress[me.slug]; if (!(finished || me.finished) && me.t > 5) progress[me.slug] = me.t;
  store.set("progress", progress); store.set("watched-" + new Date().toDateString(), watchedToday);
  P = null;
}
function closePlayer(fromPop) {
  if ($("#player").hidden) return;
  const done = P && P.finished;
  stopPlayback(false);
  const el = $("#player"); el.hidden = true; el.innerHTML = ""; el.className = "player";
  document.body.classList.remove("playing", "lock-scroll");
  orient("browse"); keepAwake(false);
  if (!fromPop) popLayer();
  const y = scrollY;
  if (tab === "home") { renderHome(); scrollTo(0, y); } else if (tab === "cat" && curCat) { renderCat(curCat); scrollTo(0, y); }
  if (done) toast("Well done! Story finished.");
}
function showRotateHint() {
  const el = $("#player"); if (el.hidden || el.querySelector(".rotate")) return;
  const h = document.createElement("div"); h.className = "rotate"; h.innerHTML = `${ICON.rotate}Turn your phone for a bigger picture`;
  el.appendChild(h); setTimeout(() => h.remove(), 4200);
}

/* ---------- Little Moments: swipe up for the next one ---------- */
let R = null, reelObs = null;
function enterMoments(slug) {
  stopReel();
  const box = $("#tab-moments"), list = shortsList();
  if (!list.length) { box.innerHTML = `<div class="tab"><div class="empty"><h3>No Little Moments yet</h3></div></div>`; return; }
  box.innerHTML = `<div class="feed-head"><h2>Little Moments</h2><span class="swipe">Swipe up for more</span></div>
    <div class="feed">${list.map(v => `<section class="reel" data-slug="${esc(v.slug)}">
      ${thumbOf(v) ? `<div class="bg" style="background-image:url('${esc(thumbOf(v))}')"></div>` : ""}
      <div class="frame">${thumbOf(v) ? `<img src="${esc(thumbOf(v))}" alt="" loading="lazy">` : ""}<div class="slot"></div></div>
      <div class="tap"></div><div class="shade"></div><div class="pz">${ICON.play}</div>
      <div class="info"><span class="eyebrow">${esc(v.parents ? "For parents" : v.kind || "Little Moment")}</span><h3>${esc(v.title)}</h3><p>${esc(v.desc)}</p></div>
      <div class="side"><button class="press" data-reel="talk"><span class="round">${ICON.talk}</span>Talk</button><button class="press" data-reel="info"><span class="round">${ICON.info}</span>About</button></div>
      <div class="rbar"><i></i></div></section>`).join("")}</div>`;
  const feed = box.querySelector(".feed");
  orient("portrait"); keepAwake(true);
  feed.addEventListener("click", e => {
    const reel = e.target.closest(".reel"); if (!reel) return;
    const b = e.target.closest("[data-reel]");
    if (b) { pauseReel(); return openSheet(reel.dataset.slug); }
    if (e.target.closest(".tap")) { if (!R || R.slug !== reel.dataset.slug) return startReel(reel); if (R.paused || !R.started) { R.eng.play(); R.eng.unmute(); } else R.eng.pause(); }
  });
  if (reelObs) reelObs.disconnect();
  reelObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && en.intersectionRatio > 0.6) startReel(en.target); }), { root: feed, threshold: [0.6] }) : null;
  $$(".reel", feed).forEach(r => reelObs && reelObs.observe(r));
  const target = slug && feed.querySelector(`.reel[data-slug="${slug}"]`);
  if (target) feed.scrollTop = target.offsetTop;
  setTimeout(() => startReel(target || feed.querySelector(".reel")), 50);
}
function startReel(reel) {
  if (!reel || (R && R.slug === reel.dataset.slug)) return;
  stopReel();
  if (settings.limit && watchedToday >= settings.limit * 60) return showBreak();
  const v = bySlug(reel.dataset.slug); if (!v) return;
  const me = R = { slug: v.slug, reel, paused: false, started: false };
  reel.classList.remove("paused");
  me.eng = makeEngine(reel.querySelector(".slot"), v, 0, {
    state: s => {
      if (R !== me) return;
      if (s === 1) { me.paused = false; reel.classList.remove("paused"); reel.classList.add("live"); if (!me.started) { me.started = true; me.eng.unmute(); } }
      if (s === 2 || s === -2) { me.paused = true; reel.classList.add("paused"); }
      if (s === 0) { const nx = reel.nextElementSibling; if (nx) nx.scrollIntoView({ behavior: "smooth" }); else { me.eng.seek(0); me.eng.play(); } }
    },
    fail: () => { if (R === me) { reel.classList.add("paused"); toast("This moment couldn't load right now."); } },
    ready: () => { if (R === me) { me.eng.play(); setTimeout(() => { if (R === me && !me.started) reel.classList.add("paused"); }, 3000); } },
  });
  me.tick = setInterval(() => { if (R !== me) return; const d = me.eng.duration(); const bar = reel.querySelector(".rbar i"); if (d && bar) bar.style.width = Math.min(100, me.eng.time() / d * 100) + "%"; if (!me.paused && me.started) watchedToday++; }, 1000);
}
function pauseReel() { if (R && R.eng) { try { R.eng.pause(); } catch (e) {} } }
function stopReel() {
  if (!R) return;
  clearInterval(R.tick); try { R.eng.destroy(); } catch (e) {}
  R.reel.classList.remove("live", "paused"); const bar = R.reel.querySelector(".rbar i"); if (bar) bar.style.width = "0";
  R = null; store.set("watched-" + new Date().toDateString(), watchedToday);
}
function leaveMoments() { stopReel(); if (reelObs) reelObs.disconnect(); $("#tab-moments").innerHTML = ""; orient("browse"); keepAwake(false); }

/* ---------- grown-ups ---------- */
function openGate() {
  const a = 3 + Math.floor(Math.random() * 5), b = 3 + Math.floor(Math.random() * 6), ans = a * b;
  const opts = [ans, ans + a, ans - b].sort(() => Math.random() - .5);
  const g = $("#gate"), wasOpen = !g.hidden;
  pauseReel();
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-label="Grown-ups only">
    <span class="eyebrow">Grown-ups only</span><h2>Ask a grown-up to answer</h2><div class="q">${a} × ${b} = ?</div>
    <div class="choices">${opts.map(o => `<button class="btn press" data-v="${o}">${o}</button>`).join("")}</div>
    <div class="msg" aria-live="polite"></div><div class="choices"><button class="btn press" data-v="close" style="font-size:16px">Back</button></div></div>`;
  g.hidden = false; if (!wasOpen) pushLayer("gate");
  g.onclick = e => {
    if (e.target === g) return closeGate();
    const btn = e.target.closest("[data-v]"); if (!btn) return;
    if (btn.dataset.v === "close") return closeGate();
    if (+btn.dataset.v === ans) openParents(); else g.querySelector(".msg").textContent = "Not quite. Ask a grown-up for help.";
  };
}
function openParents() {
  const g = $("#gate"), mins = Math.floor(watchedToday / 60);
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-label="Grown-ups">
    <span class="eyebrow">Grown-ups</span><h2>Family settings</h2>
    <div class="set"><h3>Daily screen time</h3><div class="chips">${[0, 20, 45, 90].map(m => `<button class="chip press" data-limit="${m}" aria-pressed="${settings.limit === m}">${m ? m + " min" : "No limit"}</button>`).join("")}</div>
      <span class="hint">Watched today: ${mins} min. When the limit is reached, Zara invites your child to take a break.</span></div>
    <div class="set"><h3>LittleRoots sound</h3><div class="chips">${[true, false].map(on => `<button class="chip press" data-sound="${on}" aria-pressed="${(settings.sound !== false) === on}">${on ? "On" : "Off"}</button>`).join("")}</div>
      <span class="hint">The sound that plays with the logo before each story.</span></div>
    <div class="set"><h3>Privacy</h3><span class="hint">LittleRoots shows no ads and collects no personal data from children. Watch progress stays on this device.</span></div>
    <button class="btn primary press" data-v="done">Done</button></div>`;
  g.onclick = e => {
    if (e.target === g || e.target.closest('[data-v="done"]')) return closeGate();
    const l = e.target.closest("[data-limit]");
    if (l) { settings.limit = +l.dataset.limit; store.set("settings", settings); $$("[data-limit]", g).forEach(x => x.setAttribute("aria-pressed", String(x === l))); toast(settings.limit ? `Daily limit: ${settings.limit} minutes` : "Daily limit turned off"); }
    const s = e.target.closest("[data-sound]");
    if (s) { settings.sound = s.dataset.sound === "true"; store.set("settings", settings); $$("[data-sound]", g).forEach(x => x.setAttribute("aria-pressed", String(x === s))); if (settings.sound) playSting(); }
  };
}
function closeGate(fromPop) { const g = $("#gate"); if (g.hidden) return; g.hidden = true; g.innerHTML = ""; if (!fromPop) popLayer(); }
function showBreak() {
  stopReel(); if (P) closePlayer();
  const g = $("#gate"), wasOpen = !g.hidden;
  g.innerHTML = `<div class="gate" role="dialog" aria-modal="true" aria-label="Time for a break">
    <span class="eyebrow">That's all for today</span><h2>Time to rest your eyes</h2>
    <p style="margin:0">Zara says: go tell someone the story you just watched, then come back tomorrow for more.</p>
    <div class="choices"><button class="btn primary press" data-v="ok">OK</button><button class="btn press" data-v="adult">Grown-ups</button></div></div>`;
  g.hidden = false; if (!wasOpen) pushLayer("gate");
  g.onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; if (b.dataset.v === "ok") { closeGate(); if (tab === "moments") showTab("home"); } else openGate(); };
}

/* ---------- start ---------- */
const LOGO_SVG = $("#topLeft").innerHTML;
$("#splash").innerHTML = animLogo(true) + `<p class="tagline"><span>Growing little hearts</span> <span>in God’s Word.</span></p>`;
const splashStart = Date.now(); let splashSound = false;
try { const ac = audioCtx(); if (ac && ac.state === "running") { playSting(); splashSound = true; } } catch (e) {}
["pointerdown", "touchstart", "keydown"].forEach(ev => addEventListener(ev, function joinSplash() {
  removeEventListener(ev, joinSplash);
  const t = (Date.now() - splashStart) / 1000;
  if (splashSound || !$("#splash") || t > 4.7) return; splashSound = true; unlockAudio(); playSting(t);
}, { passive: true }));
setTimeout(() => { const s = $("#splash"); s.classList.add("done"); setTimeout(() => s.remove(), 700); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 400 : 6200);

let cached = store.get("catalog", null);
if (cached && !applyCatalog(cached)) cached = null;
renderHome(); onScroll();
let pendingLib = null;
function showLibrary(lib) {
  if (P || R || !$("#sheet").hidden || !$("#gate").hidden || tab !== "home") { pendingLib = lib; return; }
  pendingLib = null;
  if (applyCatalog(lib)) { const y = scrollY; renderHome(); scrollTo(0, y); }
}
function refreshLibrary(force) {
  return fetchCatalog().then(data => {
    if (!data) { if (force) toast("Still can't reach LittleRoots. Check the internet."); return; }
    const fresh = JSON.stringify(data) !== JSON.stringify(cached);
    if (fresh || force || !CATALOG.length) { cached = data; store.set("catalog", data); if (!CATALOG.length) { applyCatalog(data); renderHome(); } else showLibrary(data); }
  });
}
refreshLibrary();
setInterval(() => { if (pendingLib) showLibrary(pendingLib); }, 2000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshLibrary();
  else { if (P && !P.paused) action("toggle"); pauseReel(); store.set("progress", progress); }
});
addEventListener("keydown", e => { if (e.key === "Escape") goBack(); if (P && e.key === " ") { e.preventDefault(); action("toggle"); } if (P && e.key === "ArrowRight") skip(10); if (P && e.key === "ArrowLeft") skip(-10); });
</script>
