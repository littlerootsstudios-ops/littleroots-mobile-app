# Checks the phone web app builds. It goes live when the LittleRoots backend deploys
# (Littleroot-tv-app repo, file mobile-app.ref says which version of this repo to serve at /m/).
name: Build phone web app
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/build.mjs", "package.json", ".github/workflows/web.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: littleroots-phone-web, path: dist/ }
